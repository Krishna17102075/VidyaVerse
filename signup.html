<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vidya Verse | Sign Up</title>

    <link rel="stylesheet" href="signup.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Section -->

    <div class="left">

        <div class="content">

            <h1>Create Account</h1>

            <p>

                Join Vidya Verse and make learning
                smarter, faster and easier.

            </p>

            <img src="https://www.jotform.com/blog/wp-content/uploads/2026/02/How-to-create-a-signup-form-with-limited-slots_1771510594-700x467.png" alt="Signup">

        </div>

    </div>

    <!-- Right Section -->

    <div class="right">

        <div class="signup-box">

            <h2>Register</h2>

            <form id="signupForm">

                <!-- Full Name -->

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                    type="text"
                    id="fullname"
                    placeholder="Full Name"
                    required>

                </div>

                <!-- Email -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

                </div>

                <!-- Phone -->

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number"
                    required>

                </div>

                <!-- College -->

                <div class="input-box">

                    <i class="fa-solid fa-building-columns"></i>

                    <input
                    type="text"
                    id="college"
                    placeholder="College Name"
                    required>

                </div>

                <!-- Course -->

                <div class="input-box">

                    <i class="fa-solid fa-graduation-cap"></i>

                    <input
                    type="text"
                    id="course"
                    placeholder="Course Name"
                    required>

                </div>

                <!-- Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                    <i
                    class="fa-solid fa-eye"
                    id="togglePassword"></i>

                </div>

                <!-- Confirm Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

                    <i
                    class="fa-solid fa-eye"
                    id="toggleConfirm"></i>

                </div>

                <button type="submit">

                    Create Account

                </button>

            </form>

            <p class="login-text">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </div>

</div>

<script src="signup.js"></script>

    <script src="i18n.js"></script>
</body>

</html>
