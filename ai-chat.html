<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vidya Verse | AI Tutor</title>

    <link rel="stylesheet" href="ai-chat.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

</head>

<body>

<div class="container">

<!-- ================= Sidebar ================= -->

<div class="sidebar">

    <div class="logo">

        <i class="fa-solid fa-robot"></i>

        <h2>AI Tutor</h2>

    </div>

    
<button class="new-chat" id="newChatBtn" type="button">
    <i class="fa-solid fa-plus"></i>
    New Chat
</button>

<h3>Recent Chats</h3>

<ul id="recentChats" class="recent-chats">
    <!-- Recent chats will be added by JavaScript -->
</ul>

</div>

<!-- ================= Main Chat ================= -->

<div class="chat-area">

    <!-- Top Bar -->

    <div class="top-bar">

        <h2> Vidya Verse - AI Tutor</h2>

        <div class="top-icons">

            <i class="fa-solid fa-moon"></i>

            <i class="fa-solid fa-user"></i>

        </div>

    </div>

    <!-- Chat Messages -->

    <div class="chat-box" id="chatBox">

        <div class="message ai">

            <div class="avatar">

                <i class="fa-solid fa-robot"></i>

            </div>

            <div class="text">

                Hello 👋

                I'm your AI Tutor.

                Ask me anything about your studies.

            </div>

        </div>

    </div>

    <!-- Input Area -->

    <div class="input-area">

        <button>

            <i class="fa-solid fa-paperclip"></i>

        </button>

        <button>

            <i class="fa-solid fa-image"></i>

        </button>

        <button>

            <i class="fa-solid fa-microphone"></i>

        </button>

        <input

        type="text"

        id="userInput"

        placeholder="Ask anything...">

        <button id="sendBtn">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="ai-chat.js"></script>
<script src="chat-history.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <script src="i18n.js"></script>
</body>

</html>
